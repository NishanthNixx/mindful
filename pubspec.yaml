name: mindfull
description: "Offline, private AI health & wellness journal."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  drift: ">=2.30.0 <2.34.6"
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ">=3.0.0 <3.4.1"
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  speech_to_text: ^7.4.0
  sqlite3: ^3.5.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ">=2.30.0 <2.34.6"
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/fonts/OFL-Literata.txt
    - assets/fonts/OFL-PlusJakartaSans.txt

  # Bundled (not fetched at runtime) so the app stays fully offline.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/literata-500-normal.ttf
          weight: 500
        - asset: assets/fonts/literata-600-normal.ttf
          weight: 600
        - asset: assets/fonts/literata-400-italic.ttf
          weight: 400
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus-jakarta-sans-400-normal.ttf
          weight: 400
        - asset: assets/fonts/plus-jakarta-sans-500-normal.ttf
          weight: 500
        - asset: assets/fonts/plus-jakarta-sans-600-normal.ttf
          weight: 600
        - asset: assets/fonts/plus-jakarta-sans-700-normal.ttf
          weight: 700
        - asset: assets/fonts/plus-jakarta-sans-400-italic.ttf
          weight: 400
          style: italic

# Bundle SQLCipher instead of plain SQLite (sqlite3 >= 3.x build hooks).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
